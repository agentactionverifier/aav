name: AAV candidate CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify
      - run: pnpm pack:inspect
      - run: pnpm clean-room
      - run: node scripts/release-extra.mjs
      - run: pnpm examples:test
      - run: pnpm compliance
      - run: node scripts/release-review.mjs
      - if: runner.os == 'Linux'
        run: docker build -f Dockerfile.local -t aav-local:candidate .
      - if: runner.os == 'Linux'
        run: pnpm docker:test
      - if: runner.os == 'Linux'
        run: pnpm compose:test
